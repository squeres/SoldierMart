<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoldierMart: управление товарами</title>
<style>
  :root { color-scheme: dark; --bg:#021024; --card:#052659; --line:#5483B3; --fg:#C1E8FF; --mute:#7DA0CA;
          --ok:#8fe3a0; --err:#ff9b9b; --warn:#ffd27a; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 14px 20px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 20px; margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 60px; }
  input, select { padding: 10px 12px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line);
                  background: var(--card); color: var(--fg); font-family: inherit; }
  button { padding: 10px 14px; font-size: 15px; border: 0; border-radius: 10px; background: var(--line);
           color: var(--bg); font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button.danger { background: #c25b5b; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .row input[type=search] { flex: 1 1 220px; min-width: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .stat { background: #031a3d; border: 1px solid #0b3a7a; border-radius: 12px; padding: 8px 14px; font-size: 14px; color: var(--mute); }
  .stat b { color: var(--fg); font-size: 18px; display: block; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid #0b3a7a; font-size: 14px; vertical-align: middle; }
  th { color: var(--mute); font-weight: 500; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.act { white-space: nowrap; text-align: right; }
  td.act button { padding: 6px 10px; font-size: 13px; margin-left: 4px; }
  tr.hidden-row td { opacity: .55; }
  .sub { color: var(--mute); font-size: 12px; margin-top: 2px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); }
  .tag.ok { color: var(--ok); border-color: var(--ok); } .tag.err { color: var(--err); border-color: var(--err); }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .stock { display: inline-flex; gap: 4px; align-items: center; }
  .stock button { padding: 3px 8px; font-size: 13px; }
  .stock b { min-width: 42px; display: inline-block; text-align: center; }
  .empty { color: var(--mute); padding: 28px 0; text-align: center; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: 90vw; padding: 12px 18px;
           border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: none; z-index: 99; }
  #toast.ok { border-color: var(--ok); } #toast.err { border-color: var(--err); }
  #login { max-width: 420px; margin: 80px auto; padding: 0 20px; }
  #login input { width: 100%; margin: 12px 0; }
  dialog { background: #031a3d; color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
           width: min(520px, 94vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--mute); }
  dialog input, dialog select { width: 100%; }
  dialog .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  dialog .check { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 15px; color: var(--fg); }
  dialog .check input { width: auto; }
  dialog .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  #formErr { color: var(--err); min-height: 20px; margin-top: 8px; font-size: 14px; }
  small { color: var(--mute); }
  a { text-decoration: none; }
</style>
</head>
<body>

<section id="login" hidden>
  <h1>Управление товарами</h1>
  <p><small>Введите ключ дежурного (файл <code>backend/data/admin.key</code>). Он хранится только в этой вкладке.</small></p>
  <input id="key" type="password" autocomplete="off" placeholder="Ключ дежурного">
  <button id="enter" style="width:100%">Войти</button>
  <p id="loginErr" class="tag err" hidden></p>
</section>

<div id="app" hidden>
  <header>
    <h1>SoldierMart: управление товарами</h1>
    <div class="row" style="margin:0">
      <a href="/panel"><button class="ghost">← Панель дежурного</button></a>
      <button class="ghost" id="refresh">Обновить</button>
      <button class="ghost" id="exit">Выйти</button>
    </div>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="row">
      <input id="q" type="search" placeholder="Поиск по названию или коду" autocomplete="off">
      <select id="fCat"></select>
      <select id="fState">
        <option value="all">Все</option>
        <option value="shown">В продаже</option>
        <option value="hidden">Скрытые</option>
        <option value="low">Мало (до 10 шт.)</option>
        <option value="out">Нет в наличии</option>
      </select>
      <button id="add">+ Добавить товар</button>
    </div>
    <div id="box"></div>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="form" autocomplete="off">
    <h2 id="dlgTitle"></h2>
    <label for="nameRu">Название (русский)</label>
    <input id="nameRu" maxlength="120" required>
    <label for="nameKk">Название (казахский), если пусто — как русское</label>
    <input id="nameKk" maxlength="120">
    <div class="two">
      <div>
        <label for="category">Категория</label>
        <select id="category"></select>
      </div>
      <div>
        <label for="icon">Значок в приложении</label>
        <select id="icon"></select>
      </div>
    </div>
    <div class="two">
      <div>
        <label for="price">Цена, ₸</label>
        <input id="price" inputmode="numeric" required>
      </div>
      <div>
        <label for="stock">Остаток, шт.</label>
        <input id="stock" inputmode="numeric" required>
      </div>
    </div>
    <div id="idRow">
      <label for="pid">Код товара (необязательно, латиница, цифры, - и _)</label>
      <input id="pid" maxlength="32" placeholder="создастся сам">
    </div>
    <label class="check"><input type="checkbox" id="active" checked> Показывать в приложении (в продаже)</label>
    <div id="formErr"></div>
    <div class="buttons">
      <button type="button" class="ghost" id="cancel">Отмена</button>
      <button type="submit" id="save">Сохранить</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const KEY = 'sm_admin_key';
let key = '';
try { key = sessionStorage.getItem(KEY) || ''; } catch {}

const errors = {
  forbidden: 'Неверный ключ дежурного.',
  unknown_product: 'Товар не найден (возможно, его уже удалили).',
  product_exists: 'Товар с таким кодом уже есть.',
  insufficient_stock: 'Остаток не может стать меньше нуля.',
  product_in_active_orders: 'Товар есть в заказах, ожидающих выдачи. Скройте его вместо удаления или сначала выдайте/отмените эти заказы.',
  too_many_requests: 'Слишком много запросов, подождите минуту.',
};
const fieldRu = { nameRu: 'название', nameKk: 'название на казахском', category: 'категория', icon: 'значок',
  price: 'цена (целое от 0 до 10 000 000)', stock: 'остаток (целое от 0 до 1 000 000)', id: 'код товара', delta: 'количество' };

function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const tenge = (n) => new Intl.NumberFormat('ru-RU').format(n) + ' ₸';
let toastTimer;
function toast(text, kind = 'ok') {
  const t = $('toast');
  t.textContent = text; t.className = kind; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = 'none'), 4000);
}
function apiError(j, status) {
  if (j.error === 'invalid_product') return 'Проверьте поле: ' + (fieldRu[j.field] || j.field);
  return errors[j.error] || 'Ошибка: ' + (j.error || status);
}
async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403) { logout(); throw new Error(errors.forbidden); }
  if (!r.ok) throw new Error(apiError(j, r.status));
  return j;
}
const run = async (fn) => { try { await fn(); } catch (e) { toast(e.message, 'err'); } };

// ---------- вход ----------
function showLogin() { $('login').hidden = false; $('app').hidden = true; }
function logout() {
  key = '';
  try { sessionStorage.removeItem(KEY); } catch {}
  showLogin();
}
async function enter() {
  key = $('key').value.trim();
  $('loginErr').hidden = true;
  try {
    await load();
    try { sessionStorage.setItem(KEY, key); } catch {}
    $('key').value = '';
    $('login').hidden = true; $('app').hidden = false;
  } catch (e) {
    $('loginErr').textContent = e.message; $('loginErr').hidden = false;
    showLogin();
  }
}
$('enter').onclick = enter;
$('key').addEventListener('keydown', (e) => e.key === 'Enter' && enter());
$('exit').onclick = logout;
$('refresh').onclick = () => run(load);

// ---------- данные ----------
let products = [], categories = [], icons = [];
const catName = (id) => categories.find((c) => c.id === id)?.ru || id;

async function load() {
  const j = await api('GET', '/admin/products');
  products = j.products; categories = j.categories; icons = j.icons;
  if (!$('fCat').options.length) {
    $('fCat').append(h('option', { value: '' }, 'Все категории'), ...categories.map((c) => h('option', { value: c.id }, c.ru)));
    $('category').append(...categories.map((c) => h('option', { value: c.id }, c.ru)));
    $('icon').append(...icons.map((i) => h('option', { value: i }, i)));
  }
  render();
}

function render() {
  const total = products.length, shown = products.filter((p) => p.active).length;
  const out = products.filter((p) => p.active && p.stock === 0).length;
  const worth = products.filter((p) => p.active).reduce((a, p) => a + p.price * p.stock, 0);
  const st = (label, val) => h('div', { class: 'stat' }, label, h('b', {}, val));
  $('stats').replaceChildren(st('Товаров', total), st('В продаже', shown), st('Скрыто', total - shown),
    st('Нет в наличии', out), st('Стоимость остатков', tenge(worth)));

  const q = $('q').value.trim().toLowerCase(), cat = $('fCat').value, state = $('fState').value;
  const list = products.filter((p) =>
    (!q || p.nameRu.toLowerCase().includes(q) || p.nameKk.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)) &&
    (!cat || p.category === cat) &&
    (state === 'all' || (state === 'shown' && p.active) || (state === 'hidden' && !p.active) ||
      (state === 'low' && p.stock > 0 && p.stock <= 10) || (state === 'out' && p.stock === 0)));

  const box = $('box');
  box.replaceChildren();
  if (!list.length) return box.append(h('div', { class: 'empty' }, products.length ? 'Ничего не найдено.' : 'Товаров пока нет. Нажмите «Добавить товар».'));
  box.append(h('table', {},
    h('thead', {}, h('tr', {}, h('th', {}, 'Товар'), h('th', {}, 'Категория'), h('th', { class: 'num' }, 'Цена'),
      h('th', { class: 'num' }, 'Остаток'), h('th', { class: 'num' }, 'Продано'), h('th', {}, 'Статус'), h('th', {}))),
    h('tbody', {}, list.map((p) => h('tr', { class: p.active ? '' : 'hidden-row' },
      h('td', {}, p.nameRu, h('div', { class: 'sub' }, `${p.nameKk} · код ${p.id} · значок ${p.icon}`)),
      h('td', {}, catName(p.category)),
      h('td', { class: 'num' }, tenge(p.price)),
      h('td', { class: 'num' }, h('span', { class: 'stock' },
        h('button', { class: 'ghost', title: '−1', onclick: () => stock(p, -1) }, '−'),
        h('b', { class: p.stock === 0 ? 'tag err' : p.stock <= 10 ? 'tag warn' : '' }, p.stock),
        h('button', { class: 'ghost', title: '+1', onclick: () => stock(p, 1) }, '+'),
        h('button', { class: 'ghost', title: 'Приход', onclick: () => restock(p) }, 'приход'))),
      h('td', { class: 'num' }, p.sold),
      h('td', {}, p.active ? h('span', { class: 'tag ok' }, 'в продаже') : h('span', { class: 'tag warn' }, 'скрыт')),
      h('td', { class: 'act' },
        h('button', { onclick: () => openForm(p) }, 'Изменить'),
        h('button', { class: 'ghost', onclick: () => toggle(p) }, p.active ? 'Скрыть' : 'Показать'),
        h('button', { class: 'danger', onclick: () => remove(p) }, 'Удалить')),
    ))),
  ));
}
for (const id of ['q', 'fCat', 'fState']) $(id).addEventListener('input', render);

// ---------- действия ----------
const replace = (p) => { products = products.map((x) => (x.id === p.id ? { ...x, ...p } : x)); render(); };

const stock = (p, delta) => run(async () => replace((await api('POST', `/admin/products/${p.id}/stock`, { delta })).product));

function restock(p) {
  const v = prompt(`Приход товара «${p.nameRu}».\nСколько штук добавить? (отрицательное число — списать)`, '10');
  if (v === null) return;
  const delta = Number(v.replace(/\s/g, ''));
  if (!Number.isInteger(delta) || delta === 0) return toast('Нужно целое число, не 0.', 'err');
  return stock(p, delta);
}

const toggle = (p) => run(async () => {
  replace((await api('PUT', `/admin/products/${p.id}`, { active: !p.active })).product);
  toast(p.active ? 'Товар скрыт из приложения.' : 'Товар снова в продаже.');
});

const remove = (p) => run(async () => {
  if (!confirm(`Удалить «${p.nameRu}» насовсем?\nИз избранного он пропадёт, прошлые заказы сохранятся.\nЕсли нужно лишь убрать из продажи, лучше нажмите «Скрыть».`)) return;
  await api('DELETE', `/admin/products/${p.id}`);
  products = products.filter((x) => x.id !== p.id);
  render();
  toast('Товар удалён.');
});

// ---------- форма ----------
let editing = null;
function openForm(p) {
  editing = p || null;
  $('dlgTitle').textContent = p ? `Изменить: ${p.nameRu}` : 'Новый товар';
  $('nameRu').value = p?.nameRu ?? '';
  $('nameKk').value = p?.nameKk ?? '';
  $('category').value = p?.category ?? categories[0].id;
  $('icon').value = p?.icon ?? 'shopping_bag';
  $('price').value = p?.price ?? '';
  $('stock').value = p?.stock ?? 0;
  $('active').checked = p ? p.active : true;
  $('pid').value = '';
  $('idRow').hidden = Boolean(p);
  $('formErr').textContent = '';
  $('dlg').showModal();
}
$('add').onclick = () => openForm(null);
$('cancel').onclick = () => $('dlg').close();

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const num = (id) => Number($(id).value.replace(/\s/g, ''));
  const body = {
    nameRu: $('nameRu').value, category: $('category').value, icon: $('icon').value,
    price: num('price'), stock: num('stock'), active: $('active').checked,
  };
  const kk = $('nameKk').value.trim();
  if (kk || editing) body.nameKk = kk || $('nameRu').value;
  const pid = $('pid').value.trim();
  if (!editing && pid) body.id = pid;
  $('save').disabled = true; $('formErr').textContent = '';
  try {
    if (editing) {
      replace((await api('PUT', `/admin/products/${editing.id}`, body)).product);
      toast('Сохранено.');
    } else {
      const { product } = await api('POST', '/admin/products', body);
      products.push({ ...product, sold: 0 });
      render();
      toast('Товар добавлен.');
    }
    $('dlg').close();
  } catch (err) {
    $('formErr').textContent = err.message;
  }
  $('save').disabled = false;
});

// ---------- старт ----------
if (key) {
  load().then(() => { $('app').hidden = false; }, () => { logout(); });
} else showLogin();
</script>
</body>
</html>
